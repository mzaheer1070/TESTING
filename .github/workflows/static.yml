# Static GitHub Pages deployment for the portfolio
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build clean static artifact
        shell: bash
        run: |
          mkdir -p _site
          rsync -a ./ ./_site/ \
            --exclude './_site/' \
            --exclude './.git/' \
            --exclude './.github/' \
            --exclude './.env' \
            --exclude './.env.*' \
            --exclude './server.ts' \
            --exclude './package.json' \
            --exclude './bun.lock' \
            --exclude './generate_resume_pdf.js' \
            --exclude './node_modules/' \
            --exclude './tsconfig*.json'

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
